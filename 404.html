<meta name="robots" content="noindex">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Unbounded:wght@700;800&display=swap">
<style>
:root{--navy:#1D3160;--paper:#EDF2F8;--soft:#51627f;--tomato:#C53D22;--tomato-lip:#96301A}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--navy);font-family:"Atkinson Hyperlegible Next",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:32px 20px}
main{display:grid;justify-items:center;text-align:center;gap:22px;max-width:520px}
svg{width:min(240px,60vw);height:auto;overflow:visible}
.pc{stroke:var(--paper);stroke-width:.12;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;animation:drift 6s ease-in-out infinite alternate}
g:nth-of-type(2n) .pc{animation-duration:7.5s}
g:nth-of-type(3n) .pc{animation-duration:5.2s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(0,-.12px) rotate(6deg)}}
h1{font-family:"Unbounded",sans-serif;font-weight:800;font-size:clamp(34px,8vw,52px);letter-spacing:-.04em;line-height:1;margin:6px 0 0}
p{margin:0;font-size:18px;line-height:1.55;color:#34466a}
a{font-family:"Unbounded",sans-serif;font-weight:700;font-size:14px;text-decoration:none;background:var(--tomato);color:#fff;padding:14px 22px;border-radius:14px;box-shadow:0 4px 0 var(--tomato-lip);transition:transform .15s,box-shadow .15s}
a:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--tomato-lip)}
a:focus-visible{outline:3px solid #F6B72B;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.pc{animation:none}}
</style>
</head>
<body>
<main>
  <!-- the tangram square, knocked apart -->
  <svg viewBox="-0.8 -0.8 5.6 5.6" aria-hidden="true">
    <g transform="translate(0 -.45) rotate(-8 2 .67)"><polygon class="pc" points="0,0 4,0 2,2" fill="#1D3160"/></g>
    <g transform="translate(-.5 0) rotate(10 .67 2)"><polygon class="pc" points="0,0 2,2 0,4" fill="#6FA8DC"/></g>
    <g transform="translate(.55 -.35) rotate(25 3.67 1)"><polygon class="pc" points="4,0 4,2 3,1" fill="#F6B72B"/></g>
    <g transform="translate(.45 .05) rotate(-12 3 2)"><polygon class="pc" points="2,2 3,1 4,2 3,3" fill="#F3A6B8"/></g>
    <g transform="translate(0 .35) rotate(30 2 2.67)"><polygon class="pc" points="2,2 3,3 1,3" fill="#23A07A"/></g>
    <g transform="translate(-.3 .55) rotate(-10 1.5 3.5)"><polygon class="pc" points="0,4 1,3 3,3 2,4" fill="#7A5AC8"/></g>
    <g transform="translate(.5 .5) rotate(12 3.33 3.33)"><polygon class="pc" points="4,2 4,4 2,4" fill="#EE5A3C"/></g>
  </svg>
  <h1>404 = 2² × 101</h1>
  <p>That's all we could find here. This page doesn't exist.</p>
  <a href="/">Back to the home page</a>
</main>
</body>
</html>
