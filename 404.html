<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · James Clemens Math Tournament</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Palette and fonts come from theme.css; pieces come from tangram.js.
     Both are relative for local preview — see AGENTS.md before changing. -->
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--navy);font-family:var(--font-body);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:32px 20px}
main{display:grid;justify-items:center;text-align:center;gap:22px;max-width:520px}
svg{width:min(240px,60vw);height:auto;overflow:visible}
.pc{stroke:var(--paper);stroke-width:.12;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;animation:drift 6s ease-in-out infinite alternate}
g:nth-of-type(2n) .pc{animation-duration:7.5s}
g:nth-of-type(3n) .pc{animation-duration:5.2s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(0,-.12px) rotate(6deg)}}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,8vw,52px);letter-spacing:-.04em;line-height:1;margin:6px 0 0}
p{margin:0;font-size:18px;line-height:1.55;color:#34466a}
a{font-family:var(--font-display);font-weight:700;font-size:14px;text-decoration:none;background:var(--tomato);color:#fff;padding:14px 22px;border-radius:14px;box-shadow:0 4px 0 var(--tomato-lip);transition:transform .15s,box-shadow .15s}
a:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--tomato-lip)}
a:focus-visible{outline:3px solid #F6B72B;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.pc{animation:none}}
</style>
</head>
<body>
<main>
  <!-- the tangram square, knocked apart; piece shapes come from tangram.js -->
  <svg viewBox="-0.8 -0.8 5.6 5.6" aria-hidden="true"></svg>
  <h1>404 = 2² × 101</h1>
  <p>That's all we could find here. This page doesn't exist.</p>
  
  <!-- CHANGE BACK TO "/" ONCE THE SITE HAS ITS OWN DOMAIN -->
  <a href="index.html">Back to the home page</a>
  <!-- --------------------------------------------------- -->

</main>
<script src="tangram.js"></script>
<script>
(function () {
  var T = window.JCMT_TANGRAM;
  if (!T) return;  // no data, no decoration — the text still reads fine
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.querySelector('main svg');
  // Same order and offsets as the hand-authored figure, so the drift
  // animation phases (g:nth-of-type) land on the same pieces.
  [
    ['LT1', 'translate(0 -.45) rotate(-8 2 .67)'],
    ['LT2', 'translate(-.5 0) rotate(10 .67 2)'],
    ['ST1', 'translate(.55 -.35) rotate(25 3.67 1)'],
    ['SQ',  'translate(.45 .05) rotate(-12 3 2)'],
    ['ST2', 'translate(0 .35) rotate(30 2 2.67)'],
    ['PG',  'translate(-.3 .55) rotate(-10 1.5 3.5)'],
    ['MT',  'translate(.5 .5) rotate(12 3.33 3.33)']
  ].forEach(function (row) {
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', row[1]);
    var p = document.createElementNS(NS, 'polygon');
    p.setAttribute('class', 'pc');
    p.setAttribute('points', T.sq[row[0]].map(function (pt) { return pt.join(','); }).join(' '));
    p.setAttribute('fill', T.COL[row[0]]);
    g.appendChild(p);
    svg.appendChild(g);
  });
})();
</script>
</body>
</html>
